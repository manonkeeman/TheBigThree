name: Supabase keep-alive + backup

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vehicles and site_settings from Supabase
        run: |
          mkdir -p backups
          curl -sf "https://loolxbizdribqyulxbop.supabase.co/rest/v1/vehicles?select=*&order=sort_order.asc" \
            -H "apikey: sb_publishable_nMu2RzoUWmaKnwjeR3kRPg_EzGzbVIg" \
            -H "Authorization: Bearer sb_publishable_nMu2RzoUWmaKnwjeR3kRPg_EzGzbVIg" \
            -o backups/vehicles-latest.json
          curl -sf "https://loolxbizdribqyulxbop.supabase.co/rest/v1/site_settings?select=*" \
            -H "apikey: sb_publishable_nMu2RzoUWmaKnwjeR3kRPg_EzGzbVIg" \
            -H "Authorization: Bearer sb_publishable_nMu2RzoUWmaKnwjeR3kRPg_EzGzbVIg" \
            -o backups/site_settings-latest.json

      - name: Commit backup if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/vehicles-latest.json backups/site_settings-latest.json
          git diff --cached --quiet || git commit -m "Automatische back-up voorraad-data $(date +%F)"
          git push
