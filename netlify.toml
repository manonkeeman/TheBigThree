[build]
  publish = "."

# Alternatieve domeinen 301-doorverwijzen naar het hoofddomein
[[redirects]]
  from = "https://bigthree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bigthree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thebig3.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thebig3.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thebigtree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thebigtree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[edge_functions]]
  path = "/voorraad/*"
  function = "vehicle-meta"

# publish = "." serveert de hele repo; onderstaande bestanden horen niet publiek
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tsconfig.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/supabase-setup.sql"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/voorraad-import.sql"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/src/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.idea/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"