[build]
  publish = "."

# Alternatieve domeinen 301-doorverwijzen naar het hoofddomein
[[redirects]]
  from = "https://bigthree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bigthree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thebig3.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thebig3.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thebigtree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thebigtree.nl/*"
  to = "https://thebigthree.nl/:splat"
  status = 301
  force = true

[[edge_functions]]
  path = "/voorraad/*"
  function = "vehicle-meta"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/"
  function = "homepage-meta"

[[edge_functions]]
  path = "/index.html"
  function = "homepage-meta"

# publish = "." serveert de hele repo; onderstaande bestanden horen niet publiek
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tsconfig.json"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/supabase-setup.sql"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/voorraad-import.sql"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/src/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.idea/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/backups/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://loolxbizdribqyulxbop.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"